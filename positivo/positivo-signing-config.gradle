
def keystorePropertiesFile = rootProject.file("positivo/positivo-keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    signingConfigs {
        positivo {
            storeFile file("../positivo/${keystoreProperties['storeFile']}")
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        positivo {
            initWith debug
            signingConfig signingConfigs.positivo
            matchingFallbacks = ['debug']
        }
        // Build de teste em PRODUCAO: herda do debug (sem minify, com logs),
        // mas NAO recebe a dependencia envconfig -> a SDK Stone usa o ambiente de PRODUCAO.
        // Por padrao usa sufixo .prod para instalar lado a lado com o app de Sandbox.
        // Com -PprodCleanId o package fica LIMPO (br.com.gate8.pos.terminal) -> usado para
        // gerar o APK de homologacao/producao real (mesmo package que vai para os clientes).
        positivoProd {
            initWith debug
            if (!project.hasProperty("prodCleanId")) {
                applicationIdSuffix ".prod"
            }
            signingConfig signingConfigs.positivo
            matchingFallbacks = ['release', 'debug']
        }
    }
}