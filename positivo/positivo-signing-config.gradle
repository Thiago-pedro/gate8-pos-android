
def keystorePropertiesFile = rootProject.file("positivo/positivo-keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    signingConfigs {
        positivo {
            storeFile file("../positivo/${keystoreProperties['storeFile']}")
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        positivo {
            initWith debug
            signingConfig signingConfigs.positivo
            matchingFallbacks = ['debug']
        }
        // Build de teste em PRODUCAO: herda do debug (sem minify, com logs),
        // mas NAO recebe a dependencia envconfig -> a SDK Stone usa o ambiente de PRODUCAO.
        // Instala lado a lado (sufixo .prod) para nao sobrescrever o app de Sandbox.
        positivoProd {
            initWith debug
            applicationIdSuffix ".prod"
            signingConfig signingConfigs.positivo
            matchingFallbacks = ['release', 'debug']
        }
    }
}